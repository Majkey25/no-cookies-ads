        <rect x="132" width="121" height="72" rx="9" fill="#0e1011" stroke="#303638"/><text x="146" y="31" fill="#fff" font-size="22" font-weight="800">84K</text><text x="146" y="51" fill="#8e989c" font-size="10">Loaded rules</text>
