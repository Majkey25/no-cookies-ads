<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" role="img" aria-labelledby="title desc">
  <title id="title">No Cookies &amp; Ads dashboard</title>
  <desc id="desc">A dark protection dashboard beside a quiet browsing summary.</desc>
  <rect width="1280" height="720" rx="28" fill="#0b0b0c"/>
  <circle cx="1120" cy="80" r="300" fill="#20b8a6" opacity=".06"/>
