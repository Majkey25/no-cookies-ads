    <text y="154" fill="#fff" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="52" font-weight="800">More control.</text>
    <text y="210" fill="#a8afb2" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="19">Request filtering + page cleanup + cookie isolation.</text>
