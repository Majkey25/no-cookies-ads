# Check twice weekly in UTC, with stable times per repository, ecosystem and directory.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: cron
      cronjob: "48 2 * * 0,3"
      timezone: Etc/UTC
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: cron
      cronjob: "52 6 * * 3,6"
      timezone: Etc/UTC
