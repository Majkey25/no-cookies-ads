name: Release extension

on:
  push:
    branches:
      - main
    paths:
      - manifest.json
      - package.json
      - package-lock.json
      - vendor/**
      - src/**
      - lib/**
      - scripts/**
      - popup.html
      - popup.css
      - popup.js
      - popup-adguard.js
      - blocking-page.html
      - blocking-page.css
      - blocking-page.js
      - icons/**
      - assets/**
      - README.md
      - RELEASE_NOTES.md
      - PRIVACY.md
      - NOTICE.md
      - LICENSE
      - .github/workflows/release.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Build extension
        run: npm run build

      - name: Test packaged extension in Chromium
        run: |
          npx playwright install --with-deps chromium
          npm run test:browser

      - name: Package extension
        run: npm run package

      - name: Verify archive layout
        shell: bash
        run: |
          unzip -Z1 dist/release/no-cookies-ads.zip | grep -Fx "manifest.json"
          test -f dist/extension/background.js
          test -f dist/extension/adguard-content.js
          test -f dist/extension/adguard-assistant.js
          test -f dist/extension/blocking-page.html
          test -f dist/extension/filters/catalog.json

      - name: Upload tested release archives
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-archives
          path: dist/release/*.zip
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout release metadata
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          sparse-checkout: |
            manifest.json
            RELEASE_NOTES.md
          sparse-checkout-cone-mode: false

      - name: Download tested release archives
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: release-archives
          path: dist/release

      - name: Read extension version
        id: version
        shell: bash
        run: |
          VERSION=$(jq -r '.version' manifest.json)
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"

      - name: Create release when missing
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists."
          else
            gh release create "$TAG" \
              dist/release/no-cookies-ads.zip \
              "dist/release/no-cookies-ads-${TAG}.zip" \
              --target "$GITHUB_SHA" \
              --title "No Cookies & Ads $TAG" \
              --notes-file RELEASE_NOTES.md
          fi
