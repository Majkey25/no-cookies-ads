name: Release extension

on:
  push:
    branches:
      - main
    paths:
      - manifest.json
      - package.json
      - package-lock.json
      - vendor/**
      - src/**
      - lib/**
      - scripts/**
      - popup.html
      - popup.css
      - popup.js
      - popup-adguard.js
      - blocking-page.html
      - blocking-page.css
      - blocking-page.js
      - icons/**
      - assets/**
      - README.md
      - RELEASE_NOTES.md
      - .github/workflows/release.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Build extension
        run: npm run build

      - name: Package extension
        run: npm run package

      - name: Verify archive layout
        shell: bash
        run: |
          unzip -Z1 dist/release/no-cookies-ads.zip | grep -Fx "manifest.json"
          test -f dist/extension/background.js
          test -f dist/extension/adguard-content.js
          test -f dist/extension/adguard-assistant.js
          test -f dist/extension/blocking-page.html
          test -f dist/extension/filters/catalog.json

      - name: Read extension version
        id: version
        shell: bash
        run: |
          VERSION=$(jq -r '.version' manifest.json)
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"

      - name: Create release when missing
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists. Refreshing reproducible assets."
          else
            gh release create "$TAG" \
              --target "$GITHUB_SHA" \
              --title "No Cookies & Ads $TAG" \
              --notes-file RELEASE_NOTES.md
          fi

      - name: Upload release archives
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          gh release upload "$TAG" \
            dist/release/no-cookies-ads.zip \
            "dist/release/no-cookies-ads-v${{ steps.version.outputs.version }}.zip" \
            --clobber
