name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  test-build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Build extension
        run: npm run build

      - name: Test packaged extension in Chromium
        run: |
          npx playwright install --with-deps chromium
          npm run test:browser

      - name: Package extension
        run: npm run package

      - name: Verify release archive root
        shell: bash
        run: |
          unzip -Z1 dist/release/no-cookies-ads.zip | grep -Fx "manifest.json"
          test -f dist/extension/manifest.json
          test -f dist/extension/background.js
          test -f dist/extension/adguard-content.js
          test -f dist/extension/adguard-assistant.js
          test -f dist/extension/blocking-page.html
          test -f dist/extension/filters/catalog.json
